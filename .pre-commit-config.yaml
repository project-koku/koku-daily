default_language_version:
  python: python3
exclude: ^tests/fixtures/legacy_sql/
repos:
- repo: https://github.com/asottile/reorder_python_imports
  rev: v3.17.0
  hooks:
  - id: reorder-python-imports
    entry: python tools/reorder_imports.py
    args: [--py3-plus, --application-directories, "koku-daily"]
- repo: https://github.com/asottile/pyupgrade
  rev: v3.21.2
  hooks:
  - id: pyupgrade
    args: [--py36-plus]
- repo: https://github.com/psf/black
  rev: 26.5.1
  hooks:
  - id: black
    args: [--line-length, "79"]
    require_serial: true
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: debug-statements
  - id: check-yaml
- repo: https://github.com/PyCQA/flake8
  rev: 7.3.0
  hooks:
  - id: flake8
