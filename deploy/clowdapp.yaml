---
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: koku-daily
objects:

- apiVersion: v1
  kind: Secret
  metadata:
    name: koku-daily-secret
  data:
    email_user: ''
    email_password: ''
  type: Opaque

- apiVersion: cloud.redhat.com/v1alpha1
  kind: ClowdApp
  metadata:
    name: koku-daily
  spec:
    envName: ${ENV_NAME}
    database:
      sharedDbAppName: koku
    objectStore:
      - ${S3_BUCKET_NAME}
    dependencies:
      - koku
    jobs:
    - name: koku-daily
      schedule: ${EMAIL_SCHEDULE}
      restartPolicy: Never
      concurrencyPolicy: Forbid
      startingDeadlineSeconds: ${{EMAIL_STARTING_DEADLINE}}
      podSpec:
        image: ${IMAGE}:${IMAGE_TAG}
        command: ["python", "job.py"]
        env:
          - name: EMAIL_USER
            valueFrom:
              secretKeyRef:
                key: email_user
                name: koku-daily-secret
                optional: true
          - name: EMAIL_PASSWORD
            valueFrom:
              secretKeyRef:
                key: email_password
                name: koku-daily-secret
                optional: true
          - name: EMAIL_GROUPS
            value: ${EMAIL_GROUPS}
          - name: PROMETHEUS_PUSH_GATEWAY
            value: ${PROMETHEUS_PUSHGATEWAY}
          - name: CLOWDER_ENABLED
            value: ${CLOWDER_ENABLED}
          - name: DATABASE_RO_HOST
            value: ${DATABASE_RO_HOST}
          - name: DATABASE_RO_PORT
            value: ${DATABASE_RO_PORT}
          - name: REPLICA_RETRY_ATTEMPTS
            value: ${REPLICA_RETRY_ATTEMPTS}
          - name: REPLICA_RETRY_DELAY
            value: ${REPLICA_RETRY_DELAY}
          - name: REPORT_WRITE_BATCH_SIZE
            value: ${REPORT_WRITE_BATCH_SIZE}
          - name: REPORT_STATEMENT_TIMEOUT_MS
            value: ${REPORT_STATEMENT_TIMEOUT_MS}
          - name: REPORT_LOCK_TIMEOUT_MS
            value: ${REPORT_LOCK_TIMEOUT_MS}
          - name: DATABASE_RO_USER
            valueFrom:
              secretKeyRef:
                name: koku-daily-ro-secret
                key: username
                optional: true
          - name: DATABASE_RO_PASSWORD
            valueFrom:
              secretKeyRef:
                name: koku-daily-ro-secret
                key: password
                optional: true
          - name: WEEKLY_REPORT_SCHEDULED_DAY
            value: ${WEEKLY_REPORT_SCHEDULED_DAY}
          - name: KEY_METRICS_NUM_MONTHS
            value: ${KEY_METRICS_NUM_MONTHS}
          - name: RUN_DAILY_REPORTS
            value: ${RUN_DAILY_REPORTS}
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        resources:
          requests:
            cpu: ${CPU_REQUEST}
            memory: ${MEMORY_REQUEST}
          limits:
            cpu: ${CPU_LIMIT}
            memory: ${MEMORY_LIMIT}

    - name: koku-daily-s3
      schedule: ${S3_SCHEDULE}
      restartPolicy: Never
      concurrencyPolicy: Forbid
      startingDeadlineSeconds: ${{S3_STARTING_DEADLINE}}
      podSpec:
        image: ${IMAGE}:${IMAGE_TAG}
        command: ["python", "job.py"]
        env:
          - name: EMAIL_GROUPS  # not used by koku-daily-s3
            value: '{}'
          - name: WAREHOUSE_PATH
            value: ${WAREHOUSE_PATH}
          - name: CLOWDER_ENABLED
            value: ${CLOWDER_ENABLED}
          - name: DATABASE_RO_HOST
            value: ${DATABASE_RO_HOST}
          - name: DATABASE_RO_PORT
            value: ${DATABASE_RO_PORT}
          - name: REPLICA_RETRY_ATTEMPTS
            value: ${REPLICA_RETRY_ATTEMPTS}
          - name: REPLICA_RETRY_DELAY
            value: ${REPLICA_RETRY_DELAY}
          - name: REPORT_WRITE_BATCH_SIZE
            value: ${REPORT_WRITE_BATCH_SIZE}
          - name: REPORT_STATEMENT_TIMEOUT_MS
            value: ${REPORT_STATEMENT_TIMEOUT_MS}
          - name: REPORT_LOCK_TIMEOUT_MS
            value: ${REPORT_LOCK_TIMEOUT_MS}
          - name: DATABASE_RO_USER
            valueFrom:
              secretKeyRef:
                name: koku-daily-ro-secret
                key: username
                optional: true
          - name: DATABASE_RO_PASSWORD
            valueFrom:
              secretKeyRef:
                name: koku-daily-ro-secret
                key: password
                optional: true
          - name: WEEKLY_REPORT_SCHEDULED_DAY
            value: ${WEEKLY_REPORT_SCHEDULED_DAY}
          - name: RUN_DAILY_REPORTS
            value: ${RUN_DAILY_REPORTS}
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        resources:
          requests:
            cpu: ${CPU_REQUEST}
            memory: ${MEMORY_REQUEST}
          limits:
            cpu: ${CPU_LIMIT}
            memory: ${MEMORY_LIMIT}

parameters:
- description: Cpu limit of service
  name: CPU_REQUEST
  value: 500m
- description: memory limit of service
  name: MEMORY_REQUEST
  value: 1Gi
- description: Cpu limit of service
  name: CPU_LIMIT
  value: "1"
- description: memory limit of service
  name: MEMORY_LIMIT
  value: 2Gi
- description: Image tag
  name: IMAGE_TAG
  required: true
- description: Image name
  name: IMAGE
  value: quay.io/redhat-services-prod/cost-mgmt-dev-tenant/koku-daily
- description: Determines Clowder deployment
  name: CLOWDER_ENABLED
  value: "true"
- description: ClowdEnv Name
  name: ENV_NAME
  requred: false
- name: EMAIL_GROUPS
  value: '{}'
- name: EMAIL_SCHEDULE
  value: '0 15 * * *'
- name: EMAIL_STARTING_DEADLINE
  value: '300'
- name: PROM_SCHEDULE
  value: '*/30 * * * *'
- name: PROM_STARTING_DEADLINE
  value: '300'
- name: PROMETHEUS_PUSHGATEWAY
  description: Prometheus push gateway and port
  value: 'prometheus-pushgateway:9091'
- name: WAREHOUSE_PATH
  value: 'metrics'
- name: S3_BUCKET_NAME
  value: koku-eph-s3
- name: S3_SCHEDULE
  value: '0 18 * * *'
- name: S3_STARTING_DEADLINE
  value: '300'
- name: WEEKLY_REPORT_SCHEDULED_DAY
  value: "6"
- name: RUN_DAILY_REPORTS
  value: "true"
- name: KEY_METRICS_NUM_MONTHS
  value: "2"
- name: DATABASE_RO_HOST
  description: Read replica hostname; required, never inferred from primary
  required: true
- name: DATABASE_RO_PORT
  description: Read replica port
  value: "5432"
- name: REPLICA_RETRY_ATTEMPTS
  description: Maximum attempts per tenant for confirmed recovery conflicts
  value: "3"
- name: REPLICA_RETRY_DELAY
  description: Delay in seconds between recovery conflict attempts
  value: "1"
- name: REPORT_WRITE_BATCH_SIZE
  description: Maximum dates per RW upsert transaction
  value: "100"
- name: REPORT_STATEMENT_TIMEOUT_MS
  description: RW statement timeout in milliseconds
  value: "5000"
- name: REPORT_LOCK_TIMEOUT_MS
  description: RW lock timeout in milliseconds
  value: "1000"
